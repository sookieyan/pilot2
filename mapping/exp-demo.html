    type: 'preload',
    auto_preload: true,
    images: function() {
      var images = [];
      flex_block.timeline_variables.forEach(function(trial) {
        trial.stimulus.forEach(function(stim) {
          images.push(stim);
        });
        trial.item.forEach(function(item) {
          images.push(item);
        });
      });
      images.push('assets/img/single.png');
      images.push('assets/img/double.png');
      images.push('assets/img/response-box.png');
      images.push('assets/img/response-box1.png');
      return images;

    continue_after_error: true,
    max_load_time: 30000
  };

  //**********************//
  // Experiment
  //**********************//

  function startExperiment() {

    var timeline = [
      preload,
      flex_block
    ];

    jsPsych.init({
      timeline: timeline,//[flex_block],//
      on_timeline_start: function () {
        trialnum = 1
      },
      on_finish: function (data) {
        console.log("on_finish");
        var trials = jsPsych.data.get().filter({trial_type: 'flex-map'}).values();

        var formattedData = [];
        for (var i = 0; i < trials.length; i++) {
          var trial = trials[i];
          formattedData.push({
            subject: trial.subject,
            IP: trial.IP,
            start_time: trial.start_time,
            stimulus: trial.stimulus,
            response: trial.response,
            response_time: trial.response_time,
            inspection_time: trial.inspection_time,
            correct: trial.correct
          });
        }

        saveData(formattedData);

        // move to saveData function
        // if (window.parent && window.parent !== window) {
        //   window.parent.location.href = 'end.html';
        // } else {
        //   window.location.href = 'end.html';
        // }
      }
    });
  }





  //**********************//
  // SAVING
  //**********************//

  // Add properties
  //jsPsych.data.addProperties({ ID: ID });

  // Save
  function saveData(data) {
    console.log("saveData");
    let csvContent = "subject,IP,start_time,stimulus,response,response_time,inspection_time,correct\n";

    for (let i = 0; i < data.length; i++) {
      const row = [
        data[i].subject,
        data[i].IP,
        data[i].start_time,
        data[i].stimulus,
        data[i].response,
        data[i].response_time,
        data[i].inspection_time,
        data[i].correct
      ].join(',');
      csvContent += row + "\n";
    }

    const timestamp = new Date().getTime();
    const date = new Date().toISOString().replace(/T/, ' ').replace(/\..+/, '').replace(/:/g, '_');
    const filename = timestamp + "_" + date + ".csv";

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "./scripts/save_file.php", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        console.log(xhr.responseText);



        if (window.parent && window.parent !== window) {
          window.parent.location.href = 'end.html';
        } else {
          window.location.href = 'end.html';
        }
      }
    };
    console.log(filename);
    console.log(csvContent);
    xhr.send(JSON.stringify({
      filename: filename,
      filedata: csvContent
    }));
  }

  window.onload = function () {
    startExperiment();
  };
