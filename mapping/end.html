<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USYD Cognitive Flexibility</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .finish-button {
            font-family: 'Aptos', sans-serif;
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
            position: absolute;
            right: 50px;
            bottom: 30px;
            font-weight: normal;
            text-decoration: none;
            color: black;
            display: block;
        }
        
        .completion-message {
            font-family: 'Aptos', sans-serif;
            font-size: 40px;
            text-align: left;
            max-width: 80%;
            line-height: 1.5;
            margin: 0 auto;
            margin-top: 150px;
            margin-left: 10%;
        }
    </style>
</head>

<body>
    <div class="content-container">
        <div class="completion-message">
            <p>您已成功完成本任务。</p>
            <p>感谢您的参与。</p>
        </div>
        
        <button id="finishBtn" class="finish-button">&lt; 完成 &gt;</button>
    </div>

    <script>
        // subject：被试编号；next：做完这个任务后该跳去哪一个任务文件夹（mapping / inference / sjt），
        // 如果 next 是 "end" 或者没有值，说明这已经是这位被试的最后一个任务，不再跳转。
        const subject = localStorage.getItem('subject');
        const next = localStorage.getItem('next');
        localStorage.removeItem('subject');
        localStorage.removeItem('next');
        console.log('subject:', subject, 'next:', next);

        // 根据"后面是否还有任务"调整页面文字和按钮，避免被试误以为整个研究已经结束
        const TASK_NAMES = { mapping: '灵活映射任务', inference: '灵活推理任务', sjt: '情境判断任务' };
        if (next && next !== 'end') {
            document.querySelector('.completion-message').innerHTML =
                '<p>您已完成本项任务。</p>' +
                '<p>后面还有一项任务（' + (TASK_NAMES[next] || '下一项任务') + '），请点击右下角\u201c继续\u201d进入下一项任务。</p>';
            document.getElementById('finishBtn').innerHTML = '&lt; 继续 &gt;';
        } else {
            document.querySelector('.completion-message').innerHTML =
                '<p>您已完成本研究的全部任务。</p><p>感谢您的参与！请点击右下角\u201c完成\u201d结束。</p>';
        }

        document.getElementById('finishBtn').addEventListener('click', function() {
            if (next && next !== 'end') {
                const redirectURL = '../' + next + '/index.html?subject=' + encodeURIComponent(subject || '') + '&next=end';
                window.location.href = redirectURL;
            } else {
                document.querySelector('.completion-message').innerHTML =
                    '<p>您已完成全部任务。</p><p>感谢您的参与！您现在可以关闭此页面。</p>';
                document.getElementById('finishBtn').style.display = 'none';
            }
        });
    </script>
</body>

</html>
