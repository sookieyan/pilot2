<script>

//======================================================
// 0. 基本参数
//======================================================
var subjectID = jsPsych.randomization.randomID(10);
var PID = jsPsych.data.urlVariables();   // 如果通过 ?PID=xxx 传参，可在此读取
var DATAPIPE_EXPERIMENT_ID = "在这里填入你在 pipe.jspsych.org 申请到的 experimentID";

// 说明：结构化推理状态标签不再单独出题询问被试，
// 而是直接从决策题里被试实际选择的字母（chosen_letter）反推得到——
// 见下方 REASONING_LABEL_MAP 对照表，以及 saveData() 里的具体用法。

//======================================================
// 1. 自定义 jsPsych 插件：sjt-forced-choice
//    用于 SJT 决策题 和 结构化推理状态标签题，两者共用同一套交互逻辑：
//    - 选项文字顺序随机打乱，但字母（A/B/C/D）只记录在后台数据里，绝不显示给被试
//    - 点击某个选项只是"选中"（高亮），不会立即结束该题，被试可以反复更改选择
//    - 必须点击"确认选择"才会真正提交、进入下一题
//    - 全程记录：每个选项的悬停（hover）次数与时长、选择被更改的次数（switch_count）、
//      完整的交互事件序列（interaction_log），全部是后台记录，界面上不会有任何体现
//======================================================
jsPsych.plugins['sjt-forced-choice'] = (function () {
  var plugin = {};

  plugin.info = {
    name: 'sjt-forced-choice',
    parameters: {
      context_html:  { type: jsPsych.plugins.parameterType.HTML_STRING, default: '' },
      question_html: { type: jsPsych.plugins.parameterType.HTML_STRING, default: '你会怎么做？' },
      options:       { type: jsPsych.plugins.parameterType.OBJECT, default: undefined }, // [{letter, text, feedback?}, ...]
      confirm_label: { type: jsPsych.plugins.parameterType.STRING, default: '确认选择' }
    }
  };

  plugin.trial = function (display_element, trial) {
    var shuffled = jsPsych.randomization.shuffle(trial.options.slice());
    var selectedIndex = null;
    var switchCount = 0;
    var interactionLog = [];   // {event, option_index, letter, t}
    var hoverStart = {};
    var startTime = performance.now();

    // ---- 渲染 ----
    var html = '';
    if (trial.context_html) {
      html += '<div class="sjt-context-box">' + trial.context_html + '</div>';
    }
    html += '<div class="sjt-question">' + trial.question_html + '</div>';
    html += '<div id="sjt-options">';
    shuffled.forEach(function (opt, i) {
      html += '<button type="button" class="sjt-option-btn" data-index="' + i + '">' + opt.text + '</button>';
    });
    html += '</div>';
    html += '<div><button type="button" id="sjt-confirm-btn" class="jspsych-btn" disabled>' + trial.confirm_label + '</button></div>';

    display_element.innerHTML = html;

    var buttons = Array.prototype.slice.call(display_element.querySelectorAll('.sjt-option-btn'));
    var confirmBtn = display_element.querySelector('#sjt-confirm-btn');

    buttons.forEach(function (btn, i) {
      btn.addEventListener('mouseenter', function () {
        hoverStart[i] = performance.now();
      });
      btn.addEventListener('mouseleave', function () {
        if (hoverStart[i] !== undefined) {
          interactionLog.push({
            event: 'hover',
            option_index: i,
            letter: shuffled[i].letter,
            duration_ms: Math.round(performance.now() - hoverStart[i]),
            t: Math.round(performance.now() - startTime)
          });
          delete hoverStart[i];
        }
      });
      btn.addEventListener('click', function () {
        if (selectedIndex !== null && selectedIndex !== i) {
          switchCount++;
        }
        selectedIndex = i;
        interactionLog.push({
          event: 'select',
          option_index: i,
          letter: shuffled[i].letter,
          t: Math.round(performance.now() - startTime)
        });
        buttons.forEach(function (b) { b.classList.remove('sjt-selected'); });
        btn.classList.add('sjt-selected');
        confirmBtn.disabled = false;
      });
    });

    confirmBtn.addEventListener('click', function () {
      if (selectedIndex === null) return;
      var rt = Math.round(performance.now() - startTime);
      var chosen = shuffled[selectedIndex];
      var hoverOnlyCount = interactionLog.filter(function (e) { return e.event === 'hover'; }).length;

      interactionLog.push({ event: 'confirm', option_index: selectedIndex, letter: chosen.letter, t: rt });

      var data = {
        chosen_letter: chosen.letter,
        chosen_text: chosen.text,
        chosen_feedback: (chosen.feedback !== undefined) ? chosen.feedback : null,
        display_order: shuffled.map(function (o) { return o.letter; }).join(''),
        switch_count: switchCount,
        hover_without_click_count: hoverOnlyCount,
        interaction_log: JSON.stringify(interactionLog),
        rt: rt
      };

      display_element.innerHTML = '';
      jsPsych.finishTrial(data);
    });
  };

  return plugin;
})();

//======================================================
// 3. 构建 timeline
//    每个决策点的顺序：决策题（记录选择+鼠标交互）→ 反馈
//    推理状态标签不再单独出题，改为在存数据时从 chosen_letter 反推（见 saveData）
//======================================================
var timeline = [];

timeline.push({ type: 'fullscreen', fullscreen_mode: true });

timeline.push({
  type: 'html-button-response',
  stimulus: '<div class="sjt-bg-box"><p>接下来你将阅读几段校园生活情境。</p>' +
             '<p>每段情境会分成几个阶段展开，每个阶段你需要从四个选项中选择你最可能采取的做法，' +
             '选择后会看到相应的反馈。请根据你的真实想法作答，没有标准答案。</p>' +
             '<p>选中某个选项后会高亮显示，如果想改选，直接点其他选项即可，确认无误后点击"确认选择"进入下一步。</p></div>',
  choices: ['开始任务']
});

scenarios.forEach(function (scenario) {

  // 每个情境开始前，先展示一次背景
  timeline.push({
    type: 'html-button-response',
    stimulus: '<div class="sjt-bg-box"><p>' + scenario.background + '</p></div>',
    choices: ['继续'],
    data: { task: 'sjt_background', scenario_id: scenario.id }
  });

  scenario.steps.forEach(function (step) {

    // ---- 1) 决策题：四个行为选项，随机顺序，记录选择+鼠标交互 ----
    var decisionTrial = {
      type: 'sjt-forced-choice',
      context_html: step.context,
      question_html: '你会怎么做？',
      options: step.options,
      confirm_label: '确认选择',
      data: {
        task: 'sjt_decision',
        scenario_id: scenario.id,
        step_id: step.id,
        driver_type: step.driver_type
      }
    };

    // ---- 2) 反馈题：读取决策题记录的 chosen_feedback ----
    var feedbackTrial = {
      type: 'html-button-response',
      stimulus: function () {
        var last = jsPsych.data.get().filter({ task: 'sjt_decision' }).last(1).values()[0];
        return '<div class="sjt-feedback-box">' + last.chosen_feedback + '</div>';
      },
      choices: ['继续'],
      data: { task: 'sjt_feedback', scenario_id: scenario.id, step_id: step.id }
    };

    timeline.push(decisionTrial, feedbackTrial);
  });
});

timeline.push({
  type: 'html-button-response',
  stimulus: '<div class="sjt-bg-box"><p>本部分任务已完成，感谢你的参与！</p></div>',
  choices: ['提交'],
  on_finish: function () { saveData(); }
});

//======================================================
// 4. 启动实验
//======================================================
jsPsych.init({
  timeline: timeline,
  on_finish: function () {
    // saveData() 已在最后一个 trial 的 on_finish 里触发，这里留空即可
  }
});

//======================================================
// 5. 保存数据到 DataPipe（不依赖悉尼服务器，落地到 OSF 项目）
//======================================================

// 字母 → 推理状态类型 对照表。
// 这是根据 15 道题里 A/B/C/D 选项的内容规律总结出来的假设（A 偏认知/任务导向，
// B 偏情感/关系导向，C 偏中庸/兼顾调整，D 偏经验依赖/回避），并非被试自己报告的结果。
// 请务必对照每道题的实际选项内容逐一检查这个假设是否成立；如果某道题不符合，
// 可以在这里为该题单独指定映射（写法见下面 STEP_LEVEL_OVERRIDE 的示例）。
var REASONING_LABEL_MAP = {
  A: "Cognitive_GoalFocused",
  B: "Affective_RelationshipFocused",
  C: "Zhongyong_BalancedAdjustment",
  D: "Experience_Avoidant"
};

// 如果某个情境的某个决策点，字母-类型对应关系和上面的默认假设不一样，
// 可以在这里按 "scenario_id.step_id" 单独覆盖，例如：
// var STEP_LEVEL_OVERRIDE = { "s3.step2": { A: "Cognitive_GoalFocused", B: "Affective_RelationshipFocused", C: "Experience_Avoidant", D: "Experience_Avoidant" } };
var STEP_LEVEL_OVERRIDE = {};

function inferReasoningLabel(scenario_id, step_id, letter) {
  var key = scenario_id + "." + step_id;
  if (STEP_LEVEL_OVERRIDE[key] && STEP_LEVEL_OVERRIDE[key][letter]) {
    return STEP_LEVEL_OVERRIDE[key][letter];
  }
  return REASONING_LABEL_MAP[letter] || '';
}

function saveData() {
  var decisions = jsPsych.data.get().filter({ task: 'sjt_decision' }).values();

  var header = [
    "subject", "scenario_id", "step_id", "driver_type",
    "action_display_order", "action_letter", "action_text", "action_rt",
    "action_switch_count", "action_hover_without_click_count", "action_interaction_log",
    "reasoning_label_inferred",
    "time_elapsed"
  ].join(',') + "\n";

  function csvField(v) {
    if (v === undefined || v === null) return '';
    return '"' + String(v).replace(/"/g, '""') + '"';
  }

  var rows = decisions.map(function (d) {
    var reasoningLabel = inferReasoningLabel(d.scenario_id, d.step_id, d.chosen_letter);
    return [
      subjectID, d.scenario_id, d.step_id, d.driver_type,
      d.display_order, d.chosen_letter, csvField(d.chosen_text), d.rt,
      d.switch_count, d.hover_without_click_count, csvField(d.interaction_log),
      reasoningLabel,
      d.time_elapsed
    ].join(',');
  });

  var csvContent = header + rows.join('\n');
  var filename = subjectID + "_sjt.csv";

  fetch("https://pipe.jspsych.org/api/data/", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "*/*" },
    body: JSON.stringify({
      experimentID: DATAPIPE_EXPERIMENT_ID,
      filename: filename,
      data: csvContent
    })
  })
  .then(function () {
    document.body.innerHTML = '<div style="text-align:center;margin-top:100px;font-size:20px;">数据已保存，感谢参与！你现在可以关闭此页面。</div>';
  })
  .catch(function (err) {
    console.error(err);
    document.body.innerHTML = '<div style="text-align:center;margin-top:100px;font-size:18px;color:#b00;">数据保存时遇到网络问题，请不要关闭页面，并联系研究者。</div>';
  });
}
